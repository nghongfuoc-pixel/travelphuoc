<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quên mật khẩu — Du Lịch Việt (TravelViet)</title>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/chatbot.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="index.html">Du Lịch Việt<span>.vn</span></a>
    <nav class="main-nav">
      <a href="index.html">Trang chủ</a>
      <a href="flights.html">Chuyến bay</a>
      <a href="tours.html">Tour</a>
    </nav>
    <span id="auth-area" class="auth-area"></span>
    <a class="cart-link" href="cart.html">
      🛒 Giỏ hàng <span id="cart-count" class="cart-badge">0</span>
    </a>
  </div>
</header>

<main class="auth-page">
  <div class="auth-card">
    <h1>Quên mật khẩu</h1>
    <p class="subtitle">Nhập email để nhận hướng dẫn đặt lại mật khẩu</p>

    <div class="auth-error" id="forgot-error"></div>
    <div class="auth-success" id="forgot-success"></div>

    <form id="forgot-form">
      <div class="form-group">
        <label for="forgot-email">Email</label>
        <input id="forgot-email" type="email" required>
      </div>
      <button type="submit" class="btn btn-accent" style="width:100%">Gửi yêu cầu</button>
    </form>

    <p class="auth-links"><a href="login.html">Quay lại đăng nhập</a></p>
  </div>
</main>

<script type="module" src="assets/js/pages/forgot-password.js"></script>
<script type="module" src="assets/js/chatbot.js"></script>
</body>
</html>
