<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tạo/Sửa Tour — Admin TravelViet</title>
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>

<div class="admin-layout">
  <aside class="admin-sidebar">
    <a class="logo" href="../index.html">Du Lịch Việt<span>.vn</span></a>
    <nav class="admin-nav">
      <a href="dashboard.html">📊 Dashboard</a>
      <a href="tours.html" class="active">🧳 Tours</a>
      <a href="flights.html">✈️ Flights</a>
      <a href="profile.html">👤 Profile</a>
    </nav>
    <div style="padding:20px;">
      <span style="display:block; color:var(--color-text-muted); font-size:0.85rem; margin-bottom:8px;">Xin chào, <strong id="admin-username"></strong></span>
      <a href="#" id="admin-logout" style="color:var(--color-danger); font-weight:600;">Đăng xuất</a>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1 id="form-title">Tạo tour</h1>
      <a class="btn btn-outline" href="tours.html">← Quay lại danh sách</a>
    </div>

    <form class="admin-form" id="tour-form">
      <div class="form-row">
        <div class="form-group">
          <label for="f-name">Tên tour</label>
          <input id="f-name" type="text" required>
        </div>
        <div class="form-group">
          <label for="f-operator">Hãng du lịch</label>
          <input id="f-operator" type="text" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="f-origin">Điểm đi</label>
          <input id="f-origin" type="text" required>
        </div>
        <div class="form-group">
          <label for="f-destination">Điểm đến</label>
          <input id="f-destination" type="text" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="f-days">Số ngày</label>
          <input id="f-days" type="number" min="1" required>
        </div>
        <div class="form-group">
          <label for="f-nights">Số đêm</label>
          <input id="f-nights" type="number" min="0" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="f-departure-date">Ngày khởi hành</label>
          <input id="f-departure-date" type="date" required>
        </div>
        <div class="form-group">
          <label for="f-departure-time">Giờ khởi hành</label>
          <input id="f-departure-time" type="time" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="f-duration">Thời lượng bay (phút)</label>
          <input id="f-duration" type="number" min="1" required>
        </div>
        <div class="form-group">
          <label for="f-price">Giá tour (VNĐ)</label>
          <input id="f-price" type="number" min="0" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="f-airline">Hãng bay</label>
          <select id="f-airline" required></select>
        </div>
        <div class="form-group">
          <label for="f-aircraft">Loại máy bay</label>
          <input id="f-aircraft" type="text" placeholder="Airbus A321, Boeing 787..." required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="f-country">Quốc gia</label>
          <select id="f-country" required></select>
        </div>
        <div class="form-group">
          <label style="display:flex; align-items:center; gap:8px; margin-top:28px;">
            <input id="f-featured" type="checkbox" style="width:auto;"> Hiển thị ở "Tour nổi bật" trang chủ
          </label>
        </div>
      </div>

      <div class="form-group">
        <label for="f-services">Dịch vụ đi kèm</label>
        <input id="f-services" type="text" placeholder="Khách sạn 4 sao, ăn 3 bữa/ngày...">
      </div>

      <div class="form-group">
        <label for="f-thumbnail">Ảnh thumbnail (600x400, không bắt buộc)</label>
        <input id="f-thumbnail" type="file" accept="image/*">
        <img id="thumbnail-preview" src="" alt="" style="display:none; max-width:240px; margin-top:10px; border-radius:8px; border:1px solid var(--color-border);">
      </div>

      <button type="submit" class="btn btn-accent">Lưu tour</button>
    </form>
  </main>
</div>

<script type="module" src="../assets/js/pages/admin/tour-form.js"></script>
</body>
</html>
