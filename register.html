<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng ký — Du Lịch Việt (TravelViet)</title>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="index.html">Du Lịch Việt<span>.vn</span></a>
    <nav class="main-nav">
      <a href="index.html">Trang chủ</a>
      <a href="flights.html">Chuyến bay</a>
      <a href="tours.html">Tour</a>
    </nav>
    <span id="auth-area" class="auth-area"></span>
    <a class="cart-link" href="cart.html">
      🛒 Giỏ hàng <span id="cart-count" class="cart-badge">0</span>
    </a>
  </div>
</header>

<main class="auth-page">
  <div class="auth-card">
    <h1>Đăng ký</h1>
    <p class="subtitle">Tạo tài khoản để đặt vé và tour dễ dàng hơn</p>

    <div class="auth-error" id="register-error"></div>

    <form id="register-form">
      <div class="form-group">
        <label for="reg-username">Username</label>
        <input id="reg-username" type="text" minlength="5" maxlength="15" required>
        <div class="field-error">5-15 ký tự, không dấu, không ký tự đặc biệt</div>
      </div>
      <div class="form-group">
        <label for="reg-email">Email</label>
        <input id="reg-email" type="email" required>
      </div>
      <div class="form-group">
        <label for="reg-password">Mật khẩu</label>
        <input id="reg-password" type="password" minlength="5" maxlength="15" required>
      </div>
      <div class="form-group">
        <label for="reg-confirm">Xác nhận mật khẩu</label>
        <input id="reg-confirm" type="password" minlength="5" maxlength="15" required>
      </div>
      <button type="submit" class="btn btn-accent" style="width:100%">Đăng ký</button>
    </form>

    <p class="auth-links">Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script type="module" src="assets/js/pages/register.js"></script>
</body>
</html>
