<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giỏ hàng — Du Lịch Việt (TravelViet)</title>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="index.html">Du Lịch Việt<span>.vn</span></a>
    <nav class="main-nav">
      <a href="index.html">Trang chủ</a>
      <a href="flights.html">Chuyến bay</a>
      <a href="tours.html">Tour</a>
    </nav>
    <span id="auth-area" class="auth-area"></span>
    <a class="cart-link" href="cart.html">
      🛒 Giỏ hàng <span id="cart-count" class="cart-badge">0</span>
    </a>
  </div>
</header>

<main>
  <div class="container cart-layout">
    <section>
      <div class="results-header">
        <h2>Giỏ hàng của bạn</h2>
        <button class="btn btn-outline" id="clear-cart-btn">Xoá giỏ hàng</button>
      </div>
      <div id="cart-items" class="list-stack"></div>
    </section>

    <aside class="cart-summary">
      <h3>Thông tin cá nhân</h3>
      <div class="cart-total-row">
        <span>Tổng cộng</span>
        <span id="cart-total">0 đ</span>
      </div>

      <form id="checkout-form">
        <div class="form-group">
          <label for="customer-name">Họ tên</label>
          <input id="customer-name" type="text" required>
        </div>
        <div class="form-group">
          <label for="customer-email">Email</label>
          <input id="customer-email" type="email" required>
        </div>
        <div class="form-group">
          <label for="customer-phone">Số điện thoại</label>
          <input id="customer-phone" type="tel" required>
        </div>
        <button type="submit" class="btn btn-accent" id="checkout-btn" style="width:100%">Đăng ký</button>
      </form>
    </aside>
  </div>
</main>

<div class="modal-overlay" id="success-modal">
  <div class="modal-card">
    <div class="icon">🎉</div>
    <h2>Đặt chỗ thành công!</h2>
    <p>Tổng thanh toán: <strong id="success-total"></strong></p>
    <p>Email xác nhận đã được gửi từ <strong>nvhai061993@gmail.com</strong> đến <strong id="success-email"></strong>.</p>
    <button class="btn btn-primary" id="close-success" style="width:100%">Về trang chủ</button>
  </div>
</div>

<footer class="site-footer">
  <div class="container">
    <p>© 2026 Du Lịch Việt (TravelViet) — Website demo, không phải dịch vụ đặt vé thật.</p>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script type="module" src="assets/js/pages/cart-page.js"></script>
</body>
</html>
